[build]
  publish = "."
  command = "node ../scripts/netlify-prebuild.js"

[build.environment]
  NODE_VERSION = "22"

# Marketing + legal SPA-ish static site
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/guidelines"
  to = "/guidelines.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Profile deep links (§21) — /u/:username opens the web stub, which hands off
# to the raftoff:// scheme when the app is installed.
[[redirects]]
  from = "/u/:username"
  to = "/u.html?username=:username"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://*.supabase.co https://server.arcgisonline.com https://unpkg.com https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com; worker-src 'self' blob:; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Waitlist → Netlify Forms (configure form name="waitlist" in index.html)
[dev]
  publish = "."
  port = 8888
